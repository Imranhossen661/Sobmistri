<script>
let products = JSON.parse(localStorage.getItem('DT64_100')||'[]');
let currentViewId=null;
if(products.length===0){
products=[
{id:1,name:'Sofa Set 3+2+1 - Demo',price:28000,cat:'furniture',images:['https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400','https://images.unsplash.com/photo-1538688525198-9b88f6f53126?w=400']},
{id:2,name:'iPhone 12 Pro',price:55000,cat:'mobile',images:['https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400']},
{id:3,name:'Yamaha R15',price:485000,cat:'bike',images:['https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400']},
]; localStorage.setItem('DT64_100', JSON.stringify(products));
}
let selectedImages=[];
document.getElementById('pFiles').addEventListener('change', function(e){
 selectedImages=[]; document.getElementById('preview').innerHTML=''; let files=e.target.files; if(files.length>100) files=Array.from(files).slice(0,100);
 document.getElementById('countTxt').innerText=files.length+'/100 ঘর'; document.getElementById('postBtn').innerText='লোড হচ্ছে...'; document.getElementById('postBtn').disabled=true; let loaded=0;
 for(let i=0;i<files.length;i++){ let r=new FileReader(); r.onload=function(ev){ selectedImages.push(ev.target.result); let d=document.createElement('div'); d.innerHTML=`<img src="${ev.target.result}" class="w-full h-14 rounded-lg object-cover">`; document.getElementById('preview').appendChild(d); loaded++; if(loaded===files.length){ document.getElementById('postBtn').innerText='✅ হোম পেজে পোস্ট করুন ('+loaded+')'; document.getElementById('postBtn').disabled=false; } }; r.readAsDataURL(files[i]); }
});

function openModal(){document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

function save100(){
 let name=document.getElementById('pName').value; let price=document.getElementById('pPrice').value; let cat=document.getElementById('pCat').value; if(!name||!price) return alert('নাম ও দাম দিন');
 if(selectedImages.length===0 && document.getElementById('pFiles').files.length>0){ alert('ছবি লোড হচ্ছে...'); return; }
 products.unshift({id:Date.now(),name:name,price:parseInt(price),cat:cat,images:selectedImages.length>0?[...selectedImages]:['https://via.placeholder.com/400?text='+encodeURIComponent(name)]});
 if(products.length>100) products=products.slice(0,100);
 localStorage.setItem('DT64_100', JSON.stringify(products)); closeModal(); document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pFiles').value=''; selectedImages=[]; document.getElementById('preview').innerHTML=''; renderAll(); alert('✅ হোম পেজে চলে গেছে! এখন হোমে সব দেখাবে');
}

function renderAll(){
 let q=document.getElementById('search').value.toLowerCase(); let dist=document.getElementById('district').value; let grid=document.getElementById('grid'); grid.innerHTML='';
 document.getElementById('totalCount').innerText=products.length;
 let filtered = products.filter(p=>p.name.toLowerCase().includes(q));
 if(filtered.length===0){ grid.innerHTML='<div class="col-span-2 text-center py-20 text-gray-400">কোন পণ্য নেই - + বেচুন চাপুন</div>'; return; }
 filtered.forEach((p,idx)=>{
  let label=dist==='৬৪ জেলা'?'ঢাকা টু ৬৪':dist==='ঢাকা'?'ঢাকার ভিতর':`ঢাকা → ${dist}`;
  let waMsg=`https://wa.me/8801908202027?text=ঘর ${idx+1}: ${encodeURIComponent(p.name)} - ৳${p.price} - ${dist}`;
  let div=document.createElement('div'); div.className='bg-white rounded-[20px] overflow-hidden border shadow-sm';
  div.innerHTML=`<div class="relative cursor-pointer" onclick="openView(${p.id})"><div class="absolute top-2 left-2 bg-yellow-400 text-black text-[9px] px-2 py-1 rounded-full font-black z-10">ঘর ${idx+1}</div><img src="${p.images[0]}" class="w-full h-[160px] object-cover"><div class="absolute bottom-2 right-2 bg-white text-black text-[9px] px-2 py-1 rounded-full font-bold">📸 ${p.images.length}</div><div class="absolute top-2 right-2 bg-black text-white text-[9px] px-2 py-1 rounded-full">${label}</div></div><div class="p-3"><div class="text-[13px] font-bold truncate">${p.name}</div><div class="text-red-600 font-black">৳${p.price.toLocaleString('bn-BD')}</div><div class="flex gap-2 mt-2"><a href="${waMsg}" target="_blank" class="flex-1 bg-green-600 text-white text-xs font-bold py-2.5 rounded-full text-center">WhatsApp</a><a href="tel:01908202027" class="bg-black text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fa fa-phone text-xs"></i></a></div></div>`;
  grid.appendChild(div);
 });
}

function openView(id){ let p=products.find(x=>x.id===id); let idx=products.findIndex(x=>x.id===id); currentViewId=id; document.getElementById('viewName').innerText=`ঘর ${idx+1} - ${p.name}`; document.getElementById('viewPrice').innerText='৳'+p.price.toLocaleString('bn-BD'); let box=document.getElementById('viewImages'); box.innerHTML=''; p.images.forEach((img,i)=>{ let d=document.createElement('div'); d.innerHTML=`<div class="text-white text-xs mb-1">${i+1}/${p.images.length}</div><img src="${img}" class="w-full rounded-2xl">`; box.appendChild(d); }); document.getElementById('waBtn').href=`https://wa.me/8801908202027?text=${encodeURIComponent(p.name)} - ৳${p.price}`; document.getElementById('viewModal').classList.remove('hidden'); }
function closeView(){document.getElementById('viewModal').classList.add('hidden');}
renderAll();
