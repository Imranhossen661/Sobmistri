<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sobmistri - 64 Zila</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui;background:#f1f5f9;display:flex;justify-content:center;padding:15px}
.card{background:#fff;max-width:480px;width:100%;padding:22px;border-radius:18px;box-shadow:0 10px 25px #0002}
.logo{font-size:26px;font-weight:900;text-align:center;color:#1e293b}.logo span{color:#f59e0b}
h2{text-align:center;margin:8px 0;color:#334155}
.status{padding:12px;border-radius:10px;text-align:center;font-weight:700;margin:12px 0;background:#dbeafe;color:#1d4ed8}
select{width:100%;padding:12px;border-radius:10px;border:1px solid #cbd5e1;font-size:16px}
.num{font-size:32px;font-weight:900;color:#2563eb;text-align:center;margin:12px 0}
.btn{display:block;background:#2563eb;color:#fff;padding:14px;border-radius:12px;text-align:center;text-decoration:none;font-weight:800;font-size:18px}
.small{font-size:13px;color:#64748b;text-align:center;margin-top:10px}
</style>
</head>
<body>
<div class="card">
<div class="logo">Sob<span>mistri</span></div>
<h2>৬৪ জেলা অটো কানেক্ট</h2>
<div id="status" class="status">📍 আপনার লোকেশন বের করা হচ্ছে...</div>
<select id="zila"><option>জেলা লোড হচ্ছে...</option></select>
<div class="num" id="num">01609035166</div>
<div id="name" style="text-align:center;font-weight:700">হেড অফিস</div>
<a id="call" href="tel:01609035166" class="btn">📞 কল করুন</a>
<div class="small">কাছে মিস্ত্রি থাকলে অটো কানেক্ট হবে, না থাকলে হেড অফিসে যাবে</div>
</div>
<script>
const zilas=["Barguna","Barishal","Bhola","Jhalokati","Patuakhali","Pirojpur","Bandarban","Brahmanbaria","Chandpur","Chattogram","Cumilla","Cox's Bazar","Feni","Khagrachhari","Lakshmipur","Noakhali","Rangamati","Dhaka","Faridpur","Gazipur","Gopalganj","Kishoreganj","Madaripur","Manikganj","Munshiganj","Narayanganj","Narsingdi","Rajbari","Shariatpur","Tangail","Bagerhat","Chuadanga","Jashore","Jhenaidah","Khulna","Kushtia","Magura","Meherpur","Narail","Satkhira","Jamalpur","Mymensingh","Netrokona","Sherpur","Bogra","Joypurhat","Naogaon","Natore","Chapainawabganj","Pabna","Rajshahi","Sirajganj","Habiganj","Moulvibazar","Sunamganj","Sylhet","Dinajpur","Gaibandha","Kurigram","Lalmonirhat","Nilphamari","Panchagarh","Rangpur","Thakurgaon"];
const mistriDB={
"Narayanganj":{n:"Narayanganj Mistri",p:"01700000001"},
"Dhaka":{n:"Dhaka Mistri",p:"01700000002"},
"Narail":{n:"Narail Mistri",p:"01700000003"},
"Gazipur":{n:"Gazipur Mistri",p:"01700000004"}
};
const head={n:"হেড অফিস",p:"01609035166"};
const sel=document.getElementById('zila'),st=document.getElementById('status'),nm=document.getElementById('num'),nm2=document.getElementById('name'),btn=document.getElementById('call');
sel.innerHTML='<option value="">জেলা সিলেক্ট করুন</option>'; zilas.forEach(z=>{let o=document.createElement('option');o.value=z;o.textContent=z;sel.appendChild(o);});
function connect(z){
let m=mistriDB[z];
if(m){nm.textContent=m.p;nm2.textContent=m.n+" - "+z;btn.href="tel:"+m.p;btn.textContent="📞 "+z+" মিস্ত্রিকে কল";st.textContent="✅ "+z+" এর মিস্ত্রি পাওয়া গেছে";st.style.background="#dcfce7";st.style.color="#166534";}
else{nm.textContent=head.p;nm2.textContent=head.n+" - "+z+" এ মিস্ত্রি নেই";btn.href="tel:"+head.p;btn.textContent="📞 হেড অফিসে কল 01609035166";st.textContent="⚠️ "+z+" এ মিস্ত্রি নেই, হেড অফিসে যাবে";st.style.background="#ffedd5";st.style.color="#9a3412";}
}
sel.addEventListener('change',()=>{if(sel.value)connect(sel.value);});
if(navigator.geolocation){
navigator.geolocation.getCurrentPosition(async p=>{
try{
let r=await fetch(`https://api.bigdatacloud.net/data/reverse-geocode-client?latitude=${p.coords.latitude}&longitude=${p.coords.longitude}&localityLanguage=en`);
let d=await r.json(); let city=d.city||d.locality||d.principalSubdivision||"";
let f=zilas.find(z=>city.toLowerCase().includes(z.toLowerCase())||z.toLowerCase().includes(city.toLowerCase()));
if(f){sel.value=f;connect(f);} else{st.textContent="📍 লোকেশন: "+city+" - নিচে জেলা সিলেক্ট করুন"; sel.value="Narayanganj"; connect("Narayanganj");}
}catch{st.textContent="নেট সমস্যা, নিচে জেলা সিলেক্ট করুন";}
},()=>{st.textContent="📍 লোকেশন Allow করেন নাই, নিচে জেলা সিলেক্ট করুন";});
}
</script>
</body>
</html>
