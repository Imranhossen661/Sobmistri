</div></div>

</div>
<script>
let products = JSON.parse(localStorage.getItem('ONLY_SHOE_100')||'[]');
let curCat='all', curSize='all';
if(products.length===0){
products=[
{id:1,name:'Nike Air Jordan 1 High',price:4200,size:'42',cat:'sneaker',brand:'Nike',images:['https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=400','https://images.unsplash.com/photo-1549298916-b41d501d3772?w=400']},
{id:2,name:'Bata Formal Office Shoe',price:2800,size:'41',cat:'formal',brand:'Bata',images:['https://images.unsplash.com/photo-1614252369475-531eba835eb1?w=400']},
{id:3,name:'Timberland Boot - 100% Leather',price:5500,size:'43',cat:'boot',brand:'Timberland',images:['https://images.unsplash.com/photo-1608256246200-53e635b5b65f?w=400']},
{id:4,name:'Apex Loafer - Brown',price:3200,size:'40',cat:'lofer',brand:'Apex',images:['https://images.unsplash.com/photo-1533867617858-e7b97e060509?w=400']},
]; localStorage.setItem('ONLY_SHOE_100', JSON.stringify(products));
}
let selectedImages=[];
document.getElementById('pFiles').addEventListener('change', function(e){
 selectedImages=[]; document.getElementById('preview').innerHTML=''; let files=e.target.files; if(files.length>100) files=Array.from(files).slice(0,100);
 document.getElementById('countTxt').innerText=files.length+'/100'; document.getElementById('postBtn').innerText='লোড হচ্ছে...'; document.getElementById('postBtn').disabled=true; let loaded=0;
 for(let i=0;i<files.length;i++){ let r=new FileReader(); r.onload=function(ev){ selectedImages.push(ev.target.result); let d=document.createElement('div'); d.innerHTML=`<img src="${ev.target.result}" class="w-full h-16 rounded-lg object-cover border">`; document.getElementById('preview').appendChild(d); loaded++; if(loaded===files.length){ document.getElementById('postBtn').innerText='✅ জুতা পোস্ট করুন ('+loaded+')'; document.getElementById('postBtn').disabled=false; } }; r.readAsDataURL(files[i]); }
});
function setCat(c){ curCat=c; document.querySelectorAll('.cat-btn').forEach(b=>b.className='cat-btn bg-gray-100 px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap'); document.getElementById('cat-'+c).className='cat-btn bg-black text-white px-4 py-2 rounded-full text-xs font-bold whitespace-nowrap'; render(); }
function setSize(s){ curSize=s; document.querySelectorAll('.size-btn').forEach(b=>b.className='size-btn bg-gray-100 px-3 py-1 rounded-full'); event.target.className='size-btn bg-black text-white px-3 py-1 rounded-full'; if(s==='all') curSize='all'; else curSize=s; render(); }
function openModal(){document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function saveShoe(){
 let name=document.getElementById('pName').value; let price=document.getElementById('pPrice').value; let size=document.getElementById('pSize').value; let cat=document.getElementById('pCat').value; let brand=document.getElementById('pBrand').value; if(!name||!price) return alert('নাম ও দাম দিন');
 if(selectedImages.length===0 && document.getElementById('pFiles').files.length>0) return alert('ছবি লোড হচ্ছে...');
 products.unshift({id:Date.now(),name:name,price:parseInt(price),size:size,cat:cat,brand:brand||'No Brand',images:selectedImages.length>0?[...selectedImages]:['https://via.placeholder.com/400?text='+encodeURIComponent(name)]});
 if(products.length>100) products=products.slice(0,100);
 localStorage.setItem('ONLY_SHOE_100', JSON.stringify(products)); closeModal(); document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; document.getElementById('pBrand').value=''; document.getElementById('pFiles').value=''; selectedImages=[]; document.getElementById('preview').innerHTML=''; render(); alert('✅ জুতা হোম পেজে চলে গেছে!');
}
function render(){
 let q=document.getElementById('search').value.toLowerCase(); let dist=document.getElementById('district').value; let grid=document.getElementById('grid'); grid.innerHTML='';
 let filtered=products.filter(p=>{
  let catOk=curCat==='all'||p.cat===curCat;
  let sizeOk=curSize==='all'||p.size===curSize;
  let searchOk=p.name.toLowerCase().includes(q)||p.brand.toLowerCase().includes(q);
  return catOk&&sizeOk&&searchOk;
 });
 document.getElementById('totalCount').innerText=filtered.length;
 if(filtered.length===0){ grid.innerHTML='<div class="col-span-2 text-center py-20 text-gray-400">এই সাইজ/ক্যাটাগরিতে জুতা নেই</div>'; return; }
 filtered.forEach((p,idx)=>{
  let label=dist==='৬৪ জেলা'?'ঢাকা টু ৬৪':`ঢাকা → ${dist}`;
  let wa=`https://wa.me/8801908202027?text=👟 ${encodeURIComponent(p.name)} Size ${p.size} - ৳${p.price} - ${dist} - sobmistri.vercel.app`;
  let div=document.createElement('div'); div.className='bg-white rounded-[24px] overflow-hidden border shadow-sm';
  div.innerHTML=`<div class="relative cursor-pointer" onclick="openView(${p.id})"><div class="absolute top-2 left-2 bg-black text-white text-[9px] px-2 py-1 rounded-full font-black">ঘর ${idx+1}</div><img src="${p.images[0]}" class="w-full h-[180px] object-cover"><div class="absolute top-2 right-2 bg-white text-black text-[10px] px-2 py-1 rounded-full font-bold">Size ${p.size}</div><div class="absolute bottom-2 left-2 bg-yellow-400 text-black text-[9px] px-2 py-1 rounded-full font-bold">${p.brand}</div><div class="absolute bottom-2 right-2 bg-white/90 text-black text-[9px] px-2 py-1 rounded-full font-bold">📸 ${p.images.length}</div></div><div class="p-3"><div class="text-[13px] font-bold truncate">${p.name}</div><div class="flex justify-between items-center mt-1"><div class="text-black font-black">৳${p.price.toLocaleString('bn-BD')}</div><div class="text-[10px] text-gray-500">${label}</div></div><div class="flex gap-2 mt-2"><a href="${wa}" target="_blank" class="flex-1 bg-black text-white text-xs font-bold py-2.5 rounded-full text-center">WhatsApp</a><a href="tel:01908202027" class="bg-green-600 text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fab fa-whatsapp text-sm"></i></a></div></div>`;
  grid.appendChild(div);
 });
}
function openView(id){ let p=products.find(x=>x.id===id); let idx=products.findIndex(x=>x.id===id); document.getElementById('viewName').innerText=`${p.name} - Size ${p.size}`; document.getElementById('viewPrice').innerText='৳'+p.price.toLocaleString('bn-BD'); document.getElementById('viewSize').innerText='Size '+p.size; document.getElementById('viewBrand').innerText=p.brand+' • '+p.cat+' • ঘর '+(idx+1); let box=document.getElementById('viewImages'); box.innerHTML=''; p.images.forEach((img,i)=>{ let d=document.createElement('div'); d.innerHTML=`<div class="text-[11px] font-bold mb-1">${i+1}/${p.images.length} - ${p.name}</div><img src="${img}" class="w-full rounded-2xl">`; box.appendChild(d); }); let dist=document.getElementById('district').value; document.getElementById('waBtn').href=`https://wa.me/8801908202027?text=👟 ${encodeURIComponent(p.name)} Size ${p.size} Brand ${p.brand} - ৳${p.price} - ${dist} থেকে নিতে চাই%0A%0Aআমার সাইজ: ${p.size}%0Aঠিকানা: ${dist}`; document.getElementById('viewModal').classList.remove('hidden'); }
function closeView(){document.getElementById('viewModal').classList.add('hidden');}
render();
</script>
