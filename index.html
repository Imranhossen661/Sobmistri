<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ONLY FOR SHOE - Auto Fill</title>
<style>
body{background:#0f0f0f;color:#fff;font-family:sans-serif;padding:15px}
.box{background:#fff;color:#111;border-radius:20px;padding:18px;max-width:500px;margin:auto}
input,select{width:100%;padding:12px;margin:6px 0;border:2px solid #eee;border-radius:12px;background:#f5f7f9}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choose{border:2px dashed #111;padding:15px;border-radius:14px;text-align:center;margin:10px 0}
.btn{width:100%;padding:14px;border:none;border-radius:12px;font-weight:800;cursor:pointer}
.btn-black{background:#111;color:#fff}
#preview{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
#preview img{width:80px;height:80px;object-fit:cover;border-radius:10px;border:2px solid #eee}
</style>
</head>
<body>

<div class="box">
<h3 style="margin:0 0 10px">ONLY FOR SHOE ALL STYLE - 36 ঘর</h3>

<label>নাম:</label>
<input type="text" id="pName" placeholder="All Style Sneaker">

<div class="grid">
<div>
<label>দাম (Discount):</label>
<input type="number" id="pDiscount" placeholder="2999">
</div>
<div>
<label>Original Market Price (অটো):</label>
<input type="number" id="pOriginal" placeholder="4500">
</div>
</div>

<div class="grid">
<div>
<label>Size</label>
<select id="pSize">
<option>Size 42</option>
<option>Size 40</option>
<option>Size 41</option>
<option>Size 43</option>
<option>Size 44</option>
</select>
</div>
<div>
<label>Category</label>
<select id="pCat">
<option>Sneaker</option>
<option>Formal</option>
<option>Loafer</option>
<option>Boot</option>
<option>Running</option>
</select>
</div>
</div>

<label>Brand</label>
<select id="pBrand">
<option>All Style</option>
<option>ONLY FOR SHOE</option>
<option>SHOE ALL STYLE</option>
</select>

<div class="choose">
<input type="file" id="fileInput" accept="image/*" multiple style="border:none">
<p style="font-size:13px;color:#666;margin:5px 0 0">Choose Files দিলেই বাকি সব অটো বসে যাবে</p>
</div>

<div id="preview"></div>

<div class="grid">
<button class="btn" style="background:#e5e7eb" onclick="location.reload()">বাতিল</button>
<button class="btn btn-black" id="postBtn">✅ পোস্ট (0)</button>
</div>

<p id="autoMsg" style="background:#dcfce7;color:#166534;padding:10px;border-radius:10px;display:none;margin-top:10px"></p>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const pName = document.getElementById('pName');
const pDiscount = document.getElementById('pDiscount');
const pOriginal = document.getElementById('pOriginal');
const pSize = document.getElementById('pSize');
const pCat = document.getElementById('pCat');
const preview = document.getElementById('preview');
const postBtn = document.getElementById('postBtn');
const autoMsg = document.getElementById('autoMsg');

// অটো প্রাইস লিস্ট - আপনি চাইলে এখানে দাম চেঞ্জ করতে পারবেন
const priceMap = {
  "Sneaker": { discount: 1999, original: 3200, name: "All Style Sneaker Premium" },
  "Formal": { discount: 2999, original: 4500, name: "Black Brogue Oxford Formal" },
  "Loafer": { discount: 2800, original: 4000, name: "Brown Suede Loafer" },
  "Boot": { discount: 3800, original: 5500, name: "Black Fur Winter Boot" },
  "Running": { discount: 2500, original: 3800, name: "Premium Running Shoe" },
  "default": { discount: 2999, original: 4500, name: "All Style Sneaker - 36 Ghor" }
};

fileInput.addEventListener('change', function(e){
  const files = e.target.files;
  if(!files.length) return;

  // 1. PREVIEW অটো দেখাবে
  preview.innerHTML = "";
  for(let file of files){
    const reader = new FileReader();
    reader.onload = ev => {
      const img = document.createElement('img');
      img.src = ev.target.result;
      preview.appendChild(img);
    };
    reader.readAsDataURL(file);
  }

  // 2. বাকি সব অটো বসে যাবে
  const cat = pCat.value;
  const data = priceMap[cat] || priceMap["default"];

  // যদি ইউজার আগে কিছু না লিখে থাকে, তাহলে অটো বসাও
  if(!pName.value) pName.value = data.name;
  if(!pDiscount.value) pDiscount.value = data.discount;
  pOriginal.value = data.original; // Original Price সবসময় অটো বসবে

  if(!pSize.value) pSize.value = "Size 42";

  // 3. বাটন আপডেট
  postBtn.textContent = `✅ পোস্ট (${files.length})`;

  // 4. মেসেজ দেখাও
  autoMsg.style.display = "block";
  autoMsg.innerHTML = `✨ অটো বসে গেছে! <br> নাম: ${data.name} <br> Original: ৳${data.original} → Discount: ৳${data.discount} → Save: ৳${data.original - data.discount}`;

  // Auto focus to save time
  setTimeout(()=> pName.focus(), 300);
});

// Category চেঞ্জ করলেও দাম অটো চেঞ্জ হবে
pCat.addEventListener('change', ()=>{
  const data = priceMap[pCat.value] || priceMap["default"];
  pName.value = data.name;
  pDiscount.value = data.discount;
  pOriginal.value = data.original;
});

postBtn.addEventListener('click', ()=>{
  if(!fileInput.files.length){
    alert("আগে ছবি Choose করুন!");
    return;
  }
  alert(`পোস্ট রেডি!\n\nনাম: ${pName.value}\nOriginal Price: ৳${pOriginal.value}\nDiscount: ৳${pDiscount.value}\nSave: ৳${pOriginal.value - pDiscount.value}\n\nএখন আপনার Vercel API তে পাঠাতে পারবেন।`);
});
</script>
</body>
</html>
