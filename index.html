<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ALL STYLE 36 Ghor</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:sans-serif}
body{background:#f2f2f5;max-width:430px;margin:0 auto;padding-bottom:90px}
.header{background:#000;color:#fff;padding:35px 20px 40px;border-radius:0 0 28px 28px}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:430px;width:100%;background:#000;display:flex;justify-content:space-around;padding:12px 0;border-radius:20px 20px 0 0;z-index:100}
.nav button{background:none;border:none;color:#888;font-size:11px;cursor:pointer}.nav.active{color:#fff!important;font-weight:800}
.card{background:#fff;border-radius:16px;padding:12px;text-align:center;position:relative;box-shadow:0 2px 8px rgba(0,0,0,0.05);cursor:pointer}
.shoe-img{width:100%;height:90px;object-fit:contain;background:#f8f8f8;border-radius:12px}
.input{width:100%;background:#f1f3f5;padding:14px;border:none;border-radius:12px;margin:6px 0}
.upload-box{border:3px dashed #000;border-radius:18px;padding:20px;text-align:center;background:#fff}
#zoomModal{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.92);display:none;align-items:center;justify-content:center;z-index:9999;flex-direction:column;padding:20px}
#zoomModal.show{display:flex}
#zoomModal img{max-width:95%;max-height:65vh;border-radius:16px;background:#fff;padding:8px}
</style>
</head>
<body>

<div id="homeView">
  <div class="header"><h1 style="font-size:32px;font-weight:900">ALL STYLE<br>36 Ghor</h1></div>
  <div style="padding:15px">
    <h3 style="font-weight:900">Trending Shoes <span style="font-size:12px;color:gray" id="count">0 Items</span></h3>
    <div id="shoeGrid" style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px"></div>
    <p id="emptyMsg" style="text-align:center;color:gray;margin-top:30px">এখনো কোনো জুতা Add করেন নাই<br>নিচে + জুতা Add এ ক্লিক করুন</p>
  </div>
</div>

<div id="addView" style="display:none;padding:15px">
  <div style="background:#fff;border-radius:20px;padding:16px">
    <h2 style="font-weight:900">নতুন জুতা Add করুন</h2>
    <input id="pName" class="input" placeholder="নাম: Black Oxford">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px">
      <input id="pOrig" class="input" placeholder="Original 4500">
      <input id="pDisc" class="input" placeholder="Discount 2999">
    </div>

    <!-- পিক আপলোড - এখন কাজ করবে -->
    <div class="upload-box">
      <p style="font-weight:900">📸 পিক আপলোডের ঘর (এখন কাজ করবে)</p>
      <input type="file" id="picUpload" accept="image/*" style="margin-top:12px;width:100%;background:#f1f3f5;padding:12px;border-radius:12px">
      <div id="previewBox" style="margin-top:12px"></div>
      <p id="status" style="font-size:12px;color:green;margin-top:8px"></p>
    </div>

    <button onclick="saveShoe()" style="width:100%;background:#000;color:#fff;padding:15px;border:none;border-radius:12px;font-weight:900;margin-top:12px">✅ সেভ করুন - Home এ দেখাবে</button>
    <button onclick="showView('home')" style="width:100%;background:#eee;border:none;padding:12px;border-radius:12px;margin-top:8px">বাতিল</button>
  </div>
</div>

<div id="zoomModal" onclick="this.classList.remove('show')">
  <img id="zoomImg" src="">
  <p style="color:#fff;margin-top:12px;font-weight:700" id="zoomTitle"></p>
  <a id="waLink" href="#" target="_blank" style="background:#25D366;color:#fff;padding:14px 22px;border-radius:30px;text-decoration:none;font-weight:900;margin-top:12px">💬 WhatsApp 01908202027</a>
  <p style="color:#aaa;font-size:12px;margin-top:10px">ক্লিক করে বন্ধ করুন</p>
</div>

<div class="nav">
  <button onclick="showView('home')" id="bHome" class="active">🏠<br>Home</button>
  <button onclick="showView('add')" id="bAdd">➕<br>Add</button>
  <button onclick="openWA()" style="color:#25D366">💬<br>WhatsApp</button>
</div>

<script>
const WA = "8801908202027";
let tempImage = "";
let shoes = JSON.parse(localStorage.getItem('onlyShoes') || "[]");

function showView(v){
  document.getElementById('homeView').style.display = v==='home'? 'block':'none';
  document.getElementById('addView').style.display = v==='add'? 'block':'none';
  document.getElementById('bHome').className = v==='home'?'active':'';
  document.getElementById('bAdd').className = v==='add'?'active':'';
  if(v==='home') renderShoes();
}

document.getElementById('picUpload').addEventListener('change', function(e){
  const file = e.target.files[0];
  if(!file){ return; }
  if(file.size > 2*1024*1024){ alert("ছবি 2MB এর কম হতে হবে ভাই"); return; }
  document.getElementById('status').innerText = "⏳ ছবি লোড হচ্ছে...";
  const reader = new FileReader();
  reader.onload = ev=>{
    tempImage = ev.target.result;
    document.getElementById('previewBox').innerHTML = `<img src="${tempImage}" style="width:100%;max-height:200px;object-fit:contain;border-radius:12px;border:2px solid #000;cursor:pointer" onclick="zoomPic(tempImage,'Preview')"> <p style="font-size:11px;color:green;margin-top:5px">✅ ছবি রেডি - এখন সেভ করুন</p>`;
    document.getElementById('status').innerText = "✅ ছবি রেডি!";
  };
  reader.readAsDataURL(file);
});

function saveShoe(){
  const name = document.getElementById('pName').value;
  const orig = document.getElementById('pOrig').value;
  const disc = document.getElementById('pDisc').value;
  if(!name){ alert("নাম লিখুন"); return; }
  if(!tempImage){ alert("ছবি সিলেক্ট করুন"); return; }
  const newShoe = { id: Date.now(), name, orig, disc, img: tempImage };
  shoes.unshift(newShoe);
  localStorage.setItem('onlyShoes', JSON.stringify(shoes));
  document.getElementById('pName').value=""; document.getElementById('pOrig').value=""; document.getElementById('pDisc').value=""; tempImage=""; document.getElementById('previewBox').innerHTML=""; document.getElementById('status').innerText="";
  alert("✅ সেভ হয়ে গেছে! Home এ দেখুন");
  showView('home');
}

function renderShoes(){
  const grid = document.getElementById('shoeGrid');
  const count = document.getElementById('count');
  const empty = document.getElementById('emptyMsg');
  grid.innerHTML="";
  count.innerText = shoes.length + " Items";
  if(shoes.length===0){ empty.style.display="block"; return; }
  empty.style.display="none";
  shoes.forEach(s=>{
    const div = document.createElement('div');
    div.className="card";
    div.innerHTML = `<img class="shoe-img" src="${s.img}"><b style="font-size:13px">${s.name}</b><br><span style="font-size:12px">৳${s.disc||''}</span> ${s.orig?`<s style="font-size:11px;color:#999">৳${s.orig}</s>`:''}<div style="font-size:10px;color:#25D366">🔍 জুম</div>`;
    div.onclick = ()=>zoomPic(s.img, `${s.name} - ৳${s.disc||s.orig}`);
    grid.appendChild(div);
  });
}

function zoomPic(src,title){
  document.getElementById('zoomImg').src=src;
  document.getElementById('zoomTitle').innerText=title||'';
  const msg = encodeURIComponent(`ভাই ${title||'এই জুতা'} টা লাগবে - 01908202027`);
  document.getElementById('waLink').href=`https://wa.me/${WA}?text=${msg}`;
  document.getElementById('zoomModal').classList.add('show');
}
function openWA(){ window.open(`https://wa.me/${WA}?text=${encodeURIComponent("ভাই জুতা লাগবে - ALL STYLE 36 Ghor")}`,'_blank'); }

renderShoes();
showView('home');
</script>
</body>
</html>
