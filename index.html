<script>

 for(let i=0;i<files.length;i++){ let reader=new FileReader(); reader.onload=function(ev){ selectedImages.push(ev.target.result); let img=document.createElement('img'); img.src=ev.target.result; img.className='w-16 h-16 rounded-xl object-cover border-2 border-black flex-shrink-0'; document.getElementById('preview').appendChild(img); }; reader.readAsDataURL(files[i]); }
});
function openModal(){document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}
function saveMultiple(){
 let bulk=document.getElementById('bulkCheck').checked;
 if(bulk){
  let text=document.getElementById('bulkText').value.trim(); if(!text) return alert('লিস্ট লিখুন');
  text.split('\n').forEach(line=>{ let parts=line.split('-'); if(parts.length>=2){ let name=parts[0].trim(); let price=parseInt(parts[1].trim()); let cat=(parts[2]||'other').trim(); products.unshift({id:Date.now()+Math.random(),name:name,price:price,cat:cat,images:selectedImages.length>0?selectedImages:['https://via.placeholder.com/400?text='+name]}); } });
 }else{
  let name=document.getElementById('pName').value; let price=document.getElementById('pPrice').value; let cat=document.getElementById('pCat').value; if(!name||!price) return alert('নাম ও দাম দিন');

 });
