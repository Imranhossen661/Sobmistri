<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DHAKA TO 64 ZILA - Everything Sell | Rocket 01908202027</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>@import url('https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@600;700&display=swap');*{font-family:'Hind Siliguri',sans-serif}</style>
</head>
<body class="bg-gray-100">
<div class="max-w-[500px] mx-auto bg-white min-h-screen shadow-2xl pb-[85px]">

<div class="bg-red-600 text-white text-center py-2 text-[12px] font-bold sticky top-0 z-[999]">🚚 ঢাকা টু ৬৪ জেলা | ঢাকা থেকে সারা বাংলাদেশ | Rocket: 01908202027</div>

<div class="bg-black text-white p-3 flex justify-between items-center">
<div><div class="text-[22px] font-black">DHAKA TO 64</div><div class="text-[10px]">ঢাকা থেকে ৬৪ জেলায় Everything Sell</div></div>
<select id="district" onchange="render()" class="bg-white text-black text-xs font-bold px-3 py-2 rounded-full">
<option value="ঢাকা">ঢাকার ভিতর - 60৳</option><option value="পাবনা">পাবনা - 120৳</option><option value="নড়াইল">নড়াইল - 120৳</option><option value="নারায়ণগঞ্জ">নারায়ণগঞ্জ - 80৳</option><option value="খুলনা">খুলনা - 130৳</option><option value="চট্টগ্রাম">চট্টগ্রাম - 150৳</option><option value="রাজশাহী">রাজশাহী - 120৳</option><option value="সিলেট">সিলেট - 150৳</option><option value="বরিশাল">বরিশাল - 130৳</option><option value="রংপুর">রংপুর - 140৳</option><option value="কুমিল্লা">কুমিল্লা - 120৳</option><option value="যশোর">যশোর - 120৳</option><option value="৬৪ জেলা" selected>৬৪ জেলা</option>
</select>
</div>

<div class="p-3 flex gap-2"><input id="search" oninput="render()" placeholder="ঢাকা থেকে কি কিনবেন? খুঁজুন..." class="flex-1 bg-gray-100 rounded-full px-4 py-3 text-sm outline-none"><button onclick="openModal()" class="bg-black text-white px-6 rounded-full font-bold text-sm">+ বেচুন</button></div>

<div class="grid grid-cols-4 gap-2 p-3 text-[11px] text-center">
<button onclick="setCat('all')" class="bg-black text-white p-3 rounded-2xl font-bold"><i class="fa fa-th-large block text-lg mb-1"></i>All</button>
<button onclick="setCat('mobile')" class="bg-blue-50 p-3 rounded-2xl"><i class="fa fa-mobile-alt block text-lg mb-1 text-blue-600"></i>মোবাইল</button>
<button onclick="setCat('bike')" class="bg-red-50 p-3 rounded-2xl"><i class="fa fa-motorcycle block text-lg mb-1 text-red-600"></i>বাইক</button>
<button onclick="setCat('electronics')" class="bg-yellow-50 p-3 rounded-2xl"><i class="fa fa-tv block text-lg mb-1"></i>ইলেকট্রনিক্স</button>
<button onclick="setCat('furniture')" class="bg-green-50 p-3 rounded-2xl"><i class="fa fa-couch block text-lg mb-1 text-green-600"></i>ফার্নিচার</button>
<button onclick="setCat('fashion')" class="bg-pink-50 p-3 rounded-2xl"><i class="fa fa-tshirt block text-lg mb-1 text-pink-600"></i>ফ্যাশন</button>
<button onclick="setCat('land')" class="bg-purple-50 p-3 rounded-2xl"><i class="fa fa-map block text-lg mb-1 text-purple-600"></i>জমি/বাড়ি</button>
<button onclick="setCat('other')" class="bg-gray-100 p-3 rounded-2xl"><i class="fa fa-box block text-lg mb-1"></i>অন্যান্য</button>
</div>

<div id="grid" class="grid grid-cols-2 gap-3 p-3"></div>

<!-- MODAL -->
<div id="modal" class="hidden fixed inset-0 bg-black/80 z-[1000] flex items-center justify-center p-4"><div class="bg-white w-full rounded-3xl p-5">
<h2 class="font-black text-lg">ঢাকা টু ৬৪ জেলা - পণ্য বেচুন</h2>
<p class="text-xs text-gray-500">ঢাকা থেকে ৬৪ জেলায় যাবে • Rocket 01908202027</p>
<input id="pName" placeholder="পণ্যের নাম" class="w-full mt-3 bg-gray-100 p-3 rounded-xl text-sm">
<input id="pPrice" type="number" placeholder="দাম" class="w-full mt-2 bg-gray-100 p-3 rounded-xl text-sm">
<select id="pCat" class="w-full mt-2 bg-gray-100 p-3 rounded-xl text-sm"><option value="furniture">ফার্নিচার</option><option value="mobile">মোবাইল</option><option value="bike">বাইক</option><option value="electronics">ইলেকট্রনিক্স</option><option value="fashion">ফ্যাশন</option><option value="land">জমি/বাড়ি</option><option value="other">অন্যান্য</option></select>
<input type="file" id="pFile" accept="image/*" class="w-full mt-2 bg-gray-100 p-3 rounded-xl text-sm">
<input id="pImgLink" placeholder="অথবা ছবির লিংক (ঐচ্ছিক)" class="w-full mt-2 bg-gray-100 p-3 rounded-xl text-sm">
<div class="flex gap-2 mt-4"><button onclick="closeModal()" class="flex-1 bg-gray-200 p-3 rounded-xl font-bold">বাতিল</button><button onclick="save()" class="flex-1 bg-black text-white p-3 rounded-xl font-bold">পোস্ট - ঢাকা টু ৬৪</button></div>
</div></div>

<div class="m-3 p-4 bg-black text-white rounded-2xl text-xs"><b>📊 DHAKA TO 64 ADMIN</b><div class="flex gap-2 mt-2"><div class="bg-white/10 p-2 rounded-xl flex-1 text-center"><div id="cP" class="text-lg font-black">0</div>পণ্য</div><div class="bg-white/10 p-2 rounded-xl flex-1 text-center"><div id="cO" class="text-lg font-black">0</div>অর্ডার</div><div class="bg-red-600 p-2 rounded-xl flex-1 text-center"><div id="cT" class="text-lg font-black">0</div>টাকা</div></div></div>

<div class="fixed bottom-0 w-full max-w-[500px] bg-white border-t flex justify-around p-3 text-[10px] font-bold">
<button onclick="render()" class="flex flex-col items-center"><i class="fa fa-home text-lg"></i>হোম</button>
<button onclick="document.getElementById('district').focus()" class="flex flex-col items-center"><i class="fa fa-map text-lg"></i>৬৪ জেলা</button>
<button onclick="openModal()" class="bg-black text-white px-6 py-2 rounded-full">+ বেচুন</button>
<button onclick="showOrders()" class="flex flex-col items-center"><i class="fa fa-box text-lg"></i>অর্ডার</button>
<a href="tel:01908202027" class="flex flex-col items-center text-red-600"><i class="fa fa-phone text-lg"></i>Rocket</a>
</div>

</div>
<script>
let products = JSON.parse(localStorage.getItem('DT64_products')||'[]');
let orders = JSON.parse(localStorage.getItem('DT64_orders')||'[]');
let cat='all';

if(products.length===0){
products=[
{id:1,name:'Wooden Sofa Set 3+2+1 - Premium',price:28000,cat:'furniture',img:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400'},
{id:2,name:'Furniture - Single Sofa Green',price:14000,cat:'furniture',img:'https://images.unsplash.com/photo-1555041469-a586c61ea9bc?w=400'},
{id:3,name:'iPhone 12 Pro 128GB',price:55000,cat:'mobile',img:'https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=400'},
{id:4,name:'Yamaha R15 V4 Bike',price:485000,cat:'bike',img:'https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=400'},
{id:5,name:'Samsung Fridge 320L',price:42000,cat:'electronics',img:'https://images.unsplash.com/photo-1571175443880-49e1d25b2bc5?w=400'},
{id:6,name:'Gents Panjabi Premium',price:2500,cat:'fashion',img:'https://images.unsplash.com/photo-1596755094514-f87e34085b2c?w=400'},
]; localStorage.setItem('DT64_products', JSON.stringify(products));
}

function setCat(c){cat=c; render();}
function openModal(){document.getElementById('modal').classList.remove('hidden');}
function closeModal(){document.getElementById('modal').classList.add('hidden');}

function save(){
let name=document.getElementById('pName').value; let price=document.getElementById('pPrice').value; let pcat=document.getElementById('pCat').value; let link=document.getElementById('pImgLink').value; let file=document.getElementById('pFile').files[0];
if(!name||!price) return alert('নাম ও দাম দিন');
if(file){
 let reader=new FileReader(); reader.onload=function(e){ addProd(name,price,pcat,e.target.result); }; reader.readAsDataURL(file);
}else{ addProd(name,price,pcat,link||`https://via.placeholder.com/400?text=${name}`); }
}
function addProd(name,price,pcat,img){
 products.unshift({id:Date.now(),name:name,price:parseInt(price),cat:pcat,img:img});
 localStorage.setItem('DT64_products', JSON.stringify(products)); closeModal(); document.getElementById('pName').value=''; document.getElementById('pPrice').value=''; render();
}

function render(){
let q=document.getElementById('search').value.toLowerCase();
let dist=document.getElementById('district').value;
let grid=document.getElementById('grid'); grid.innerHTML='';
let filtered=products.filter(p=> (cat==='all'||p.cat===cat) && p.name.toLowerCase().includes(q));
filtered.forEach(p=>{
 let charge = dist==='ঢাকা'?60 : dist==='নারায়ণগঞ্জ'?80 : dist==='৬৪ জেলা'?120 : 120;
 let label = dist==='৬৪ জেলা'? 'ঢাকা টু ৬৪ জেলা' : dist==='ঢাকা'? 'ঢাকার ভিতর • 24h' : `ঢাকা → ${dist} • 48h`;
 let div=document.createElement('div'); div.className='bg-white rounded-[20px] overflow-hidden border shadow-sm';
 div.innerHTML=`<div class="relative"><img src="${p.img}" class="w-full h-[150px] object-cover"><div class="absolute top-2 left-2 bg-black text-white text-[10px] px-3 py-1 rounded-full font-bold">${label}</div><div class="absolute top-2 right-2 bg-yellow-400 text-black text-[10px] px-2 py-1 rounded-full font-bold">🚚 ${charge}৳</div></div><div class="p-3"><div class="text-[13px] font-bold line-clamp-2 h-[38px]">${p.name}</div><div class="text-red-600 font-black text-[17px] mt-1">৳${p.price.toLocaleString('bn-BD')}</div><div class="text-[10px] text-gray-500 mt-1">📍 ঢাকা Hub • ${label}</div><div class="flex gap-2 mt-3"><button onclick="buy(${p.id})" class="flex-1 bg-black text-white text-xs font-bold py-2.5 rounded-full">কিনুন</button><a href="tel:01908202027" class="bg-green-600 text-white w-10 h-10 rounded-full flex items-center justify-center"><i class="fa fa-phone"></i></a></div></div>`;
 grid.appendChild(div);
});
document.getElementById('cP').innerText=products.length; document.getElementById('cO').innerText=orders.length;
let total=orders.reduce((s,o)=>s+o.total,0); document.getElementById('cT').innerText=total;
}

function buy(id){
let p=products.find(x=>x.id===id); let dist=document.getElementById('district').value;
let charge = dist==='ঢাকা'?60 : dist==='নারায়ণগঞ্জ'?80 : 120;
let total=p.price+charge;
let name=prompt(`ঢাকা টু ${dist}\n${p.name}\nমোট ৳${total} (${p.price}+${charge} ডেলিভারি)\n\nআপনার নাম:`); if(!name) return;
let phone=prompt('ফোন নম্বর:'); if(!phone) return;
let addr=prompt(`${dist} এর ঠিকানা:`); if(!addr) return;
if(confirm(`Confirm?\n${p.name}\n${name} - ${dist}\nTotal ৳${total}\nAdvance 200৳ Rocket 01908202027`)){
 orders.unshift({total:total,district:dist,product:p.name,time:new Date().toLocaleString('bn-BD')}); localStorage.setItem('DT64_orders', JSON.stringify(orders)); alert(`✅ অর্ডার OK!\nঢাকা থেকে ${dist} এ 48h এ যাবে\nRocket 01908202027 এ 200৳ পাঠান`); render();
}
}
function showOrders(){ if(orders.length===0) return alert('অর্ডার নেই'); alert(orders.map(o=>`${o.product} - ${o.district} - ৳${o.total}`).join('\n')); }
render();
</script>
</body>
</html>
